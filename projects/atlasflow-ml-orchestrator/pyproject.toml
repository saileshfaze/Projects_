[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "atlasflow-ml-orchestrator"
version = "0.1.0"
description = "Reproducible ML experiment registry with lineage, drift gates, and auditable model promotion"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Sailesh"}]
license = {text = "MIT"}
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.8,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5,<2", "numpy>=1.26,<3"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[project.scripts]
atlasflow = "atlasflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlasflow"]

[tool.hatch.build]
include = ["src/atlasflow/**", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
