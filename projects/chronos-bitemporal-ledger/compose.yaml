services:
  chronos:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CHRONOS_DB: /data/chronos.sqlite3
    volumes:
      - chronos-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
volumes:
  chronos-data:
