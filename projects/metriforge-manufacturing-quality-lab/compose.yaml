services:
  api:
    build: .
    ports:
      - "127.0.0.1:${METRIFORGE_PORT:-8080}:8080"
    environment:
      METRIFORGE_DB: /app/state/metriforge.sqlite
    volumes:
      - metriforge-state:/app/state
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
volumes:
  metriforge-state:
