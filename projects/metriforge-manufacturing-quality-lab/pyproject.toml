[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metriforge-quality-lab"
version = "0.1.0"
description = "Manufacturing process monitoring with auditable SPC, capability indices and synthetic factory telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Sailesh"}]
maintainers = [{name = "Sailesh"}]
dependencies = ["numpy>=1.26,<3", "fastapi>=0.110,<1", "pydantic>=2,<3", "uvicorn>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[project.scripts]
metriforge = "metriforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
exclude = ["data", "reports"]
[tool.ruff.lint]
select = ["E9", "F"]
