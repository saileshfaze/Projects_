# Nested CI template only. Copy to repository-root .github/workflows to activate.
name: Meridian CI template
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './projects/meridian-supply-chain-optimizer[dev]'
      - run: python -m pytest -q projects/meridian-supply-chain-optimizer/tests
