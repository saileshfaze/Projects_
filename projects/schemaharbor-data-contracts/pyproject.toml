[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "schemaharbor-data-contracts"
version = "0.1.0"
description = "Offline data contract compatibility, validation and lineage lab"
requires-python = ">=3.11"
authors = [{name = "Sailesh"}]
license = {text = "MIT"}
[project.scripts]
schemaharbor = "schemaharbor.cli:main"
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 120
