# Nested template only; move to repository root .github/workflows to activate.
name: SchemaHarbor CI template
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './projects/schemaharbor-data-contracts[dev]'
      - run: python -m pytest -q projects/schemaharbor-data-contracts/tests
