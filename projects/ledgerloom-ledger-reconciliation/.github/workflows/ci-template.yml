name: LedgerLoom validation (copy to repository root .github/workflows to activate)
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "./projects/ledgerloom-ledger-reconciliation[dev]"
      - run: cd projects/ledgerloom-ledger-reconciliation && python -m pytest -q
