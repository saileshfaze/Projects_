[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ledgerloom-lab"
version = "0.1.0"
description = "Deterministic double-entry accounting and statement reconciliation laboratory"
requires-python = ">=3.10"
[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
api = ["fastapi>=0.100", "uvicorn>=0.23"]
[project.scripts]
ledgerloom = "ledgerloom.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
