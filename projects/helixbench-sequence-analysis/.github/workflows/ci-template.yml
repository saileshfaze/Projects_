name: HelixBench CI template (copy to repository root .github/workflows to activate)
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./projects/helixbench-sequence-analysis pytest ruff
      - run: python -m pytest projects/helixbench-sequence-analysis/tests -q
      - run: ruff check projects/helixbench-sequence-analysis/src projects/helixbench-sequence-analysis/tests
