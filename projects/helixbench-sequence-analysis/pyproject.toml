[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "helixbench-sequence-analysis"
version = "0.1.0"
description = "Deterministic synthetic DNA sequence analysis reference"
requires-python = ">=3.10"
[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]
api = ["fastapi>=0.100", "uvicorn>=0.20"]
[project.scripts]
helixbench = "helixbench.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
