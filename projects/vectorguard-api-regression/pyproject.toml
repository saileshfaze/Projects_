[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vectorguard-api-regression"
version = "0.2.0"
description = "Versioned API response contracts and semantic regression detection"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Sailesh"}]
license = {text = "MIT"}
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.6,<1", "pytest-cov>=5,<8"]
ml = ["sentence-transformers>=3,<6"]

[project.scripts]
vectorguard = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
