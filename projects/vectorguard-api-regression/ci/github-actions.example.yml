name: VectorGuard CI
on:
  push:
    paths:
      - "projects/vectorguard-api-regression/**"
      - ".github/workflows/vectorguard-ci.yml"
  pull_request:
    paths:
      - "projects/vectorguard-api-regression/**"
      - ".github/workflows/vectorguard-ci.yml"
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/vectorguard-api-regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest -q
      - name: Generate synthetic data
        run: python scripts/generate_synthetic.py
      - name: Verify regression gate
        run: |
          set +e
          python -m app.cli data/baseline_orders.json data/candidate_orders.json
          status=$?
          test "$status" -eq 1
