[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "lexiindex-search-engine"
version = "0.1.0"
description = "SQLite inverted index and BM25 retrieval laboratory"
requires-python = ">=3.10"
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
[project.scripts]
lexiindex = "lexiindex.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
