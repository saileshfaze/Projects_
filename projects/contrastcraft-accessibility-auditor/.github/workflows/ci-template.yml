name: ContrastCraft CI Template
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ./projects/contrastcraft-accessibility-auditor pytest ruff
      - run: cd projects/contrastcraft-accessibility-auditor && pytest -q
      - run: cd projects/contrastcraft-accessibility-auditor && ruff check src tests
