services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VOLTPILOT_DB: /app/state/voltpilot.db
    volumes:
      - voltpilot-state:/app/state
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
volumes:
  voltpilot-state:
