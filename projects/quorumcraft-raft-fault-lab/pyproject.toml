[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quorumcraft-raft-fault-lab"
version = "0.1.0"
description = "Deterministic Raft consensus, fault injection and safety verification laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Sailesh"}]
maintainers = [{name = "Sailesh"}]
keywords = ["raft", "distributed-systems", "consensus", "fault-injection", "simulation"]
dependencies = ["fastapi>=0.110,<1", "pydantic>=2,<3", "uvicorn>=0.29,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.7,<1"]

[project.scripts]
quorumcraft = "quorumcraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
