# Copy to repository root .github/workflows/flagship.yml to activate.
name: Flagship project tests
on:
  push:
    paths: ["projects/flagship-progressive-delivery/**"]
  pull_request:
    paths: ["projects/flagship-progressive-delivery/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "projects/flagship-progressive-delivery[dev]"
      - run: cd projects/flagship-progressive-delivery && pytest -q
