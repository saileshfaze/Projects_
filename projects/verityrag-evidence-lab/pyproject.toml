[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verityrag-evidence-lab"
version = "0.1.0"
description = "Offline hybrid retrieval, citation verification, and ranking evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sailesh"}]
maintainers = [{name = "Sailesh", email = "105965746+saileshfaze@users.noreply.github.com"}]
dependencies = ["fastapi>=0.110,<1", "pydantic>=2.5,<3", "uvicorn>=0.29,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[project.scripts]
verityrag = "verityrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
