[build-system]
requires = ['hatchling>=1.25']
build-backend = 'hatchling.build'
[project]
name = 'routeforge-logistics'
version = '0.1.0'
requires-python = '>=3.11'
dependencies = ['fastapi>=0.115,<1', 'uvicorn>=0.30,<1', 'pydantic>=2.8,<3']
[project.optional-dependencies]
dev = ['pytest>=8,<10', 'httpx>=0.27,<1', 'ruff>=0.6,<1']
[tool.hatch.build.targets.wheel]
packages = ['src/routeforge']
[project.scripts]
routeforge = 'routeforge.cli:main'
