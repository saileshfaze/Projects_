[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "voltgrid-microgrid-dispatch"
version = "0.1.0"
description = "MILP microgrid battery dispatch and carbon analytics"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Sailesh" }]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.7,<3", "numpy>=1.26,<3", "scipy>=1.13,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.6,<1"]
reports = ["reportlab>=4,<5"]

[project.scripts]
voltgrid = "voltgrid.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voltgrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
