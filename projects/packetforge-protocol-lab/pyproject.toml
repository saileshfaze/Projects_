[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "packetforge-protocol-lab"
version = "0.1.0"
description = "Deterministic framed-wire protocol testing laboratory"
requires-python = ">=3.10"
[project.scripts]
packetforge = "packetforge.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
