[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "policymesh-access-control"
version = "0.1.0"
description = "Deterministic attribute-based access control reference lab"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
[project.scripts]
policymesh = "policymesh.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 120
