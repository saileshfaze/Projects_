# Inactive nested workflow. Copy to repository-root .github/workflows/ to activate.
name: PolicyMesh CI template
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './projects/policymesh-access-control[dev]'
      - run: python -m pytest -q projects/policymesh-access-control/tests
