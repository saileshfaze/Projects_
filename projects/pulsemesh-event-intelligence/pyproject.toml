[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pulsemesh-event-intelligence"
version = "0.1.0"
description = "Contract-driven multi-tenant event ingestion and anomaly analytics"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Sailesh"}]
license = {file = "LICENSE"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.7,<1"]

[project.scripts]
pulsemesh = "pulsemesh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsemesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
