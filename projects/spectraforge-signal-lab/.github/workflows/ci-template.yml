# Nested template; copy to repository root .github/workflows/ to activate.
name: SpectraForge CI Template
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
        working-directory: projects/spectraforge-signal-lab
      - run: pytest -q
        working-directory: projects/spectraforge-signal-lab
      - run: ruff check src tests
        working-directory: projects/spectraforge-signal-lab
