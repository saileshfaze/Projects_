# Template: copy to repository-root .github/workflows/ to activate.
name: terraflux-ci
on:
  push:
    paths:
      - 'projects/terraflux-geospatial-change-lab/**'
  pull_request:
    paths:
      - 'projects/terraflux-geospatial-change-lab/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/terraflux-geospatial-change-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src
      - run: pytest -q
      - run: python scripts/check_determinism.py
