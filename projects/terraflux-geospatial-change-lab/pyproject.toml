[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terraflux-geospatial-change-lab"
version = "0.1.0"
description = "Reproducible multispectral land-cover change screening and geospatial evidence exports"
requires-python = ">=3.11"
authors = [{name = "Sailesh"}]
maintainers = [{name = "Sailesh"}]
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3", "fastapi>=0.110,<1", "pydantic>=2,<3", "uvicorn>=0.27,<1", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[project.scripts]
terraflux = "terraflux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
