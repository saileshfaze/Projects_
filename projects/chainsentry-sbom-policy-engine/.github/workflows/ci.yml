# This workflow is a template inside the project folder.
# GitHub Actions only discovers workflows under the repository-root .github/workflows/.
name: ChainSentry CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Unit and API tests
        run: pytest -q
      - name: Lint
        run: ruff check src tests scripts
