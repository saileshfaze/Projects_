[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chainsentry-sbom-policy-engine"
version = "0.1.0"
description = "Offline SBOM normalization, dependency analysis and security policy evaluation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Sailesh"}]
license = {file = "LICENSE"}
dependencies = ["packaging>=24,<27"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
chainsentry = "chainsentry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
