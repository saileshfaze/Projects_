# Copy to .github/workflows/causalpilot.yml at repository root to activate.
name: causalpilot-checks
on:
  push:
    paths:
      - 'projects/causalpilot-experiment-platform/**'
  pull_request:
    paths:
      - 'projects/causalpilot-experiment-platform/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/causalpilot-experiment-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[api,dev]'
      - run: python -m pytest
      - run: ruff check src tests
      - run: python scripts/run_demo.py
