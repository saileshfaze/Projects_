[build-system]
requires=["hatchling>=1.25"]
build-backend="hatchling.build"

[project]
name="sentinel-stream-risk-platform"
version="0.1.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic-settings>=2.5,<3","sqlalchemy>=2.0,<3","scikit-learn>=1.5,<2","numpy>=2.0,<3","prometheus-client>=0.20,<1"]

[project.optional-dependencies]
dev=["pytest>=8.3,<9","httpx>=0.27,<1","ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages=["app"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
[tool.ruff]
line-length=100
target-version="py311"
