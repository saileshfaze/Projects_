# Template: copy to repository-root .github/workflows/ to activate.
name: Vaultline CI
on:
  push:
    paths:
      - "projects/vaultline-content-addressed-backup/**"
  pull_request:
    paths:
      - "projects/vaultline-content-addressed-backup/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,api]"
        working-directory: projects/vaultline-content-addressed-backup
      - run: python -m pytest -q
        working-directory: projects/vaultline-content-addressed-backup
      - run: python -m compileall -q src tests scripts
        working-directory: projects/vaultline-content-addressed-backup
