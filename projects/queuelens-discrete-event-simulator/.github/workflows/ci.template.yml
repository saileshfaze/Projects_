# Inactive nested template; move to root .github/workflows to enable.
name: QueueLens CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e './projects/queuelens-discrete-event-simulator[dev]'
      - run: pytest -q projects/queuelens-discrete-event-simulator/tests
